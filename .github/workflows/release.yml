name: Release Build

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  build-release:
    name: Build Release Apk
    runs-on: macos-latest
    if: github.repository == 'sunls24/bv'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: 'true'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Add signing properties
        env:
          SIGNING_PROPERTIES: ${{ secrets.SIGNING_PROPERTIES }}
        run: |
          echo "$SIGNING_PROPERTIES" | base64 -Dd > signing.properties

      - name: Add signing key
        env:
          SIGN_KEY: ${{ secrets.SIGN_KEY }}
        run: |
          echo "$SIGN_KEY" | base64 -Dd > key.jks

      - name: Build apk
        run: ./gradlew assembleRelease

      - name: Validate release version
        run: |
          release_version_name="$(jq -r '.elements[0].versionName' app/build/outputs/apk/release/output-metadata.json)"
          tag_version_name="${GITHUB_REF_NAME#v}"
          if [[ "$release_version_name" != "$tag_version_name" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match APK version $release_version_name" >&2
            exit 1
          fi
          echo "release_info_version_name=$release_version_name" >> "$GITHUB_ENV"

      - name: Get changelog
        id: changelog
        run: |
          {
            echo "changelog<<EOF"
            echo "$(git log --pretty=format:"- %s (%h)" ${{ github.event.before }}..${{ github.sha }})"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Archive release build mappings
        uses: actions/upload-artifact@v4
        with:
          name: Release build mappings
          path: app/build/outputs/mapping/release

      - name: Archive release build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Release build artifact
          path: app/build/outputs/apk/release/*.apk

      # zip mapping because softprops/action-gh-release can't upload folder

      - name: Zip mapping
        run: zip -rj mapping.zip app/build/outputs/mapping/release

      # upload to github release

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            mapping.zip
          tag_name: ${{ github.ref_name }}
          name: ${{ env.release_info_version_name }}
          prerelease: false
          body: ${{ env.changelog }}
          target_commitish: ${{ github.sha }}
