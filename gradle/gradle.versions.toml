[versions]
agp = "9.3.1"
kotlin = "2.4.10"
koin-compiler = "1.1.0"
protobuf = "0.10.0"
versions = "0.61.0"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

# https://insert-koin.io/docs/setup/compiler-plugin/
koin-compiler = { id = "io.insert-koin.compiler.plugin", version.ref = "koin-compiler" }

# https://github.com/google/protobuf-gradle-plugin
google-protobuf = { id = "com.google.protobuf", version.ref = "protobuf" }

# https://github.com/ben-manes/gradle-versions-plugin
versions = { id = "io.github.ben-manes.versions", version.ref = "versions" }
