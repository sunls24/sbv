name: Feature Build

on:
  push:
    branches:
      - 'feature/**'

jobs:
  build:
    name: Build Feature APK
    runs-on: macos-latest
    if: github.repository == 'sunls24/bv'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'true'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Add signing properties
        env:
          SIGNING_PROPERTIES: ${{ secrets.SIGNING_PROPERTIES }}
        run: |
          echo "$SIGNING_PROPERTIES" | base64 -Dd > signing.properties

      - name: Add signing key
        env:
          SIGN_KEY: ${{ secrets.SIGN_KEY }}
        run: |
          echo "$SIGN_KEY" | base64 -Dd > key.jks

      - name: Build APK
        run: ./gradlew assembleRelease

      - name: Archive build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Feature release build
          path: app/build/outputs/apk/release/*.apk
